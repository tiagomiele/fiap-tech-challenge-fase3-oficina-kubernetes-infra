# Overlay de produção. Nenhum valor sensível.

global:
  customAttributes:
    environment: production
  lowDataMode: true

newrelic-infrastructure:
  kubelet:
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 384Mi
  ksm:
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 384Mi

newrelic-prometheus-agent:
  config:
    common:
      scrape_interval: 30s
